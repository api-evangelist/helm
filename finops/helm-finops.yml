notes: Helm is a CNCF-graduated open-source project distributed under Apache 2.0; it has no invoice surface
  of its own. FinOps for a Helm-based release pipeline is really FinOps over (a) the Kubernetes clusters Helm
  installs into, (b) the chart repository / OCI registry the charts live in, and (c) the storage/egress costs
  of upstream image pulls referenced by chart values. Meters and unit-economics are therefore stubs that
  point at the underlying cloud and registry providers.
description: 'FOCUS-aligned FinOps definition for Helm. Helm itself is zero-cost open-source software;
  cost is incurred downstream by the cluster operator, registry host, and image store. This artifact
  records the FinOps shape of a Helm-driven release pipeline rather than a Helm-billed product.'
