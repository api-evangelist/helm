principles:
  - name: Visibility
    description: Track Helm release activity through 'helm list', the Kubernetes audit log, and (when
      using GitOps) ArgoCD or Flux dashboards. Tag releases with team / environment labels so cluster
      cost attribution can flow through.
  - name: Allocation
    description: Allocate spend not against Helm itself but against the Kubernetes namespaces and label
      sets that Helm installs into. Use cluster-cost tools (OpenCost, Kubecost) keyed on the labels Helm
      sets via 'app.kubernetes.io/instance'.
  - name: Optimization
    description: Helm-specific levers - prefer OCI registries with authenticated pulls to avoid Docker Hub
      anonymous limits, mirror frequently-pulled charts internally, pin chart versions to skip
      unnecessary 'helm repo update' churn, and use 'helm template' in CI to fail fast before consuming
      cluster resources.
  - name: Accountability
    description: Owners of each Helm chart in your internal catalog are responsible for the resource
      requests/limits in default values.yaml; FinOps reviews should look at chart defaults as a primary
      lever for cluster cost.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - Onboarding Workloads
      - Intersecting Disciplines
meters:
  - name: chart_installs
    description: Number of Helm releases installed per cluster / namespace; surrogate for downstream
      cluster cost
    unit: install
    aggregation: count
    dimensions:
      - cluster
      - namespace
      - chart_name
      - chart_version
  - name: chart_pulls
    description: Pulls of chart artifacts from the upstream chart repository or OCI registry
    unit: pull
    aggregation: sum
    dimensions:
      - registry
      - chart_name
      - chart_version
  - name: image_pulls
    description: Container image pulls triggered by Helm-installed workloads (registry-side meter, not
      Helm-side)
    unit: pull
    aggregation: sum
    dimensions:
      - registry
      - image
apis:
  - name: Helm Chart Repository API
    baseURL: ''
    tags:
