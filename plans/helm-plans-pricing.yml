specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Helm
providerId: helm
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Charts
  - Cloud Native
  - Container Orchestration
  - DevOps
  - Kubernetes
  - Package Manager
  - Open Source
notes: Helm is a CNCF-graduated open-source project (the package manager for Kubernetes), distributed under
  the Apache 2.0 license. The Helm project itself does not sell hosted APIs and publishes no commercial
  pricing. The 'Helm Chart Repository API' is a specification consumers self-host (or that downstream vendors
  such as Artifact Hub, JFrog Artifactory, GitHub, Harbor, Bitnami host on commercial terms of their own).
  Plan / pricing artifacts therefore belong to the downstream chart-repository host, not to the Helm project.
  This artifact is left intentionally minimal until / unless the Helm project offers a paid hosted service.
sources:
  - https://helm.sh/docs/
  - https://github.com/helm/helm
  - https://www.cncf.io/projects/helm/
plans:
  - id: helm-open-source
    name: Helm (Open Source)
    type: freemium
    description: Helm is free, open-source software released under the Apache 2.0 license by the Helm project
      and the Cloud Native Computing Foundation. There is no charge to download, run, distribute, or self-host
      Helm or its chart-repository specification. Costs incurred by users are entirely infrastructure costs
      for self-hosting (object storage, compute, egress) or fees paid to third-party chart-repository
      vendors.
    entries:
      - label: Helm CLI and Libraries
        description: Open-source distribution; no charge from the Helm project
        name: distribution
        type: quota
        metric: install
        limit: -1
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Self-Hosted Chart Repository
        description: Costs are external (object storage / CDN / compute paid to AWS, GCP, Azure, etc.)
        name: self_hosted_repo
        type: metered
        metric: varies
        limit: -1
        timeFrame: month
        geo: global
        domains: []
        unit: 1
        price: 'see your hosting provider (S3, GCS, Azure Blob, OCI registry, GitHub Pages, etc.)'
        userMultiplied: false
    elements:
      - name: Apache 2.0 License
      - name: CNCF Graduated Project
      - name: Helm CLI
      - name: Helm Go SDK
      - name: Helm Plugins
      - name: Helm Chart Repository Specification
      - name: Helm Chart.yaml Schema
      - name: Helm Values YAML Schema
      - name: Helm Repository Index Schema
      - name: Helm Chart Template API
